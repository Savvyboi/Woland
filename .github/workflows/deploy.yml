name: Build and publish the site

on:
  push:
    branches: [main]
    paths: ["site/**", "woland/**", "config/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Check out the tip of the branch (not the commit that triggered the run), so the data
      # the collection job has just pushed is included.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Requires Settings → Pages → Source: "GitHub Actions" (see README).
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build cache (months that have not changed are not rebuilt)
        uses: actions/cache@v4
        with:
          path: .cache/build
          key: build-${{ github.run_id }}
          restore-keys: build-

      - run: python -m woland build --out _site --base-url "${{ steps.pages.outputs.base_url }}"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
