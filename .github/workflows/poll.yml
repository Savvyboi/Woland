name: Hourly feeds

# Some outlets can only be read through feeds that hold a few hours of news (TASS's Russian service holds
# about half a day). Read them every hour or so, so that nothing slips through. GitHub starts scheduled jobs
# late, or drops them, when it is busy: on 27 September 2026 an hourly schedule ran five times in twenty
# hours, and in the days after a quarter-hourly one about every six hours. So the job is scheduled every
# quarter of an hour, and a run that finds the feeds were read less than 40 minutes ago stops at once.
# The website itself is rebuilt once a day by the nightly collection.

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woland-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The tip of the branch, not the commit that was current when the run was queued: a run that waited
      # behind the nightly collection would otherwise commit on top of data the nightly run has replaced.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Translation model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/woland/models
          key: mt-ru-en-1.9

      # The budget keeps a site that refuses pages from holding the job past its timeout (the pages
      # not read by then are kept from the feeds as headline-only records), and the next run from
      # waiting behind it: a nightly run queued behind a poll is cancelled if another poll is queued too.
      - run: python -m woland poll --min-gap 40 --budget 10

      - name: Commit
        run: bash .github/commit-data.sh "Feeds $(date -u +%Y-%m-%dT%H:%M)"
