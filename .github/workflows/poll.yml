name: Hourly feeds

# Some outlets can only be read through feeds that hold a few hours of news (TASS's Russian service holds
# about three). Read them every hour or so, so that nothing slips through. GitHub starts scheduled jobs
# late, or drops them, when it is busy: on 27 September 2026 an hourly schedule ran five times in twenty
# hours. So the job is scheduled every quarter of an hour, and a run that finds the feeds were read less
# than 40 minutes ago stops at once.
# The website itself is rebuilt once a day by the nightly collection.

on:
  schedule:
    - cron: "8,23,38,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woland-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Translation model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/woland/models
          key: mt-ru-en-1.9

      # The budget keeps a site that refuses pages from holding the job past its timeout (the pages
      # not read by then are kept from the feeds as headline-only records), and the next run from
      # waiting behind it: a nightly run queued behind a poll is cancelled if another poll is queued too.
      - run: python -m woland poll --min-gap 40 --budget 10

      # Under Savvyboi's no-reply address, so the repository keeps a single contributor.
      - name: Commit
        run: |
          git config user.name "woland-bot"
          git config user.email "123981133+Savvyboi@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Feeds $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 10))
          done
          exit 1
