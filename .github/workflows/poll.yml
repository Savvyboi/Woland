name: Hourly feeds

# Some outlets can only be read through feeds that hold a few hours of news (TASS's Russian
# service, Gazeta.ru, Zvezda, the Kremlin). Read them every hour so nothing slips through.
# The website itself is rebuilt once a day by the nightly collection.

on:
  schedule:
    - cron: "43 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: woland-data
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Translation model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/woland/models
          key: mt-ru-en-1.9

      - run: python -m woland poll

      - name: Commit
        run: |
          git config user.name "woland-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Feeds $(date -u +%Y-%m-%dT%H:%M)"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 10))
          done
          exit 1
