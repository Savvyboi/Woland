name: Nightly collection

# Every night: collect the previous Moscow day (and repair any gap back to 1 September 2026),
# commit the new articles to data/, then rebuild and publish the website.
# The first run after setting up the repository fills in everything since the start date.

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 04:17 Moscow time
  workflow_dispatch:
    inputs:
      catch_up:
        description: "How many days back to repair gaps"
        default: "45"
      outlets:
        description: "Only these outlets (comma-separated ids; empty = all)"
        default: ""
      budget:
        description: "Stop fetching after this many minutes"
        default: "270"

permissions:
  contents: write

concurrency:
  group: woland-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      # The tip of the branch, not the commit that was current when the run was queued (see poll.yml).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Translation model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/woland/models
          key: mt-ru-en-1.9

      - name: Collect
        env:
          CATCH_UP: ${{ inputs.catch_up || '45' }}
          OUTLETS: ${{ inputs.outlets || '' }}
          BUDGET: ${{ inputs.budget || '270' }}
        run: |
          args=(--catch-up "$CATCH_UP" --budget "$BUDGET")
          if [ -n "$OUTLETS" ]; then args+=(--outlets "$OUTLETS"); fi
          python -m woland collect "${args[@]}"

      # After a long catch-up, some headlines and leads may still lack a translation; later runs finish the job.
      - name: Translate missing headlines, leads and snippets
        run: python -m woland translate --days 45 --budget 30

      - name: Commit new articles
        run: bash .github/commit-data.sh "Collect $(date -u +%Y-%m-%d)"

      # Every stored record well-formed and filed under its day (after committing, so a problem is
      # reported without holding back the day's collection).
      - name: Check the archive
        run: pip install -q pytest && python -m pytest -q tests/test_data.py

  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
