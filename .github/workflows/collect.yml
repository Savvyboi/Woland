name: Nightly collection

# Every night: collect the previous Moscow day (and repair any gap back to 1 September 2026),
# commit the new articles to data/, then rebuild and publish the website.
# The first run after setting up the repository fills in everything since the start date.

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 04:17 Moscow time
  workflow_dispatch:
    inputs:
      catch_up:
        description: "How many days back to repair gaps"
        default: "45"
      outlets:
        description: "Only these outlets (comma-separated ids; empty = all)"
        default: ""
      budget:
        description: "Stop fetching after this many minutes"
        default: "270"

permissions:
  contents: write

concurrency:
  group: woland-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      # The tip of the branch, not the commit that was current when the run was queued (see poll.yml).
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Translation model cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/woland/models
          key: mt-ru-en-1.9

      - name: Collect
        env:
          CATCH_UP: ${{ inputs.catch_up || '45' }}
          OUTLETS: ${{ inputs.outlets || '' }}
          BUDGET: ${{ inputs.budget || '270' }}
        run: |
          args=(--catch-up "$CATCH_UP" --budget "$BUDGET")
          if [ -n "$OUTLETS" ]; then args+=(--outlets "$OUTLETS"); fi
          python -m woland collect "${args[@]}"

      # After a long catch-up, some headlines and leads may still lack a translation; later runs finish the job.
      - name: Translate missing headlines, leads and snippets
        run: python -m woland translate --days 45 --budget 30

      # Up to 100 of each outlet's last-week pages asked for again, to notice articles taken down (woland/vanish.py).
      - name: Re-check last week's pages
        continue-on-error: true
        run: python -m woland recheck --budget 20

      - name: Commit new articles
        run: bash .github/commit-data.sh "Collect $(date -u +%Y-%m-%d)"

      # Every stored record well-formed and filed under its day (after committing, so a problem is
      # reported without holding back the day's collection).
      - name: Check the archive
        run: pip install -q pytest && python -m pytest -q tests/test_data.py

  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

  # A dead man's switch, if one is set up: a service such as healthchecks.io that is told when each night's run
  # ends, and warns when one fails or does not come at all (GitHub drops scheduled runs when it is busy).
  # Set the repository secret HEALTHCHECKS_PING_URL to the check's ping URL; without it nothing is sent.
  healthcheck:
    needs: [collect, deploy]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tell the health check how the run ended
        env:
          PING_URL: ${{ secrets.HEALTHCHECKS_PING_URL }}
          OUTCOME: ${{ (needs.collect.result == 'success' && needs.deploy.result == 'success') && 'success' || 'fail' }}
        run: |
          if [ -z "$PING_URL" ]; then
            echo "No HEALTHCHECKS_PING_URL secret: nothing to tell."
            exit 0
          fi
          url="$PING_URL"
          if [ "$OUTCOME" != success ]; then url="${PING_URL%/}/fail"; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$url" || echo "::warning::The health check did not answer."
