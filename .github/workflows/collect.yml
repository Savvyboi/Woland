name: Nightly collection

# Every night: collect the previous Moscow day (and repair any gap back to 1 September 2026),
# commit the new articles to data/, then rebuild and publish the website.
# The first run after setting up the repository fills in everything since the start date.

on:
  schedule:
    - cron: "17 1 * * *"   # 01:17 UTC = 04:17 Moscow time
  workflow_dispatch:
    inputs:
      catch_up:
        description: "How many days back to repair gaps"
        default: "45"
      outlets:
        description: "Only these outlets (comma-separated ids; empty = all)"
        default: ""
      budget:
        description: "Stop fetching after this many minutes"
        default: "270"

permissions:
  contents: write

concurrency:
  group: woland-data
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Translation model cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/woland/models
          key: mt-ru-en-1.9

      - name: Collect
        env:
          CATCH_UP: ${{ inputs.catch_up || '45' }}
          OUTLETS: ${{ inputs.outlets || '' }}
          BUDGET: ${{ inputs.budget || '270' }}
        run: |
          args=(--catch-up "$CATCH_UP" --budget "$BUDGET")
          if [ -n "$OUTLETS" ]; then args+=(--outlets "$OUTLETS"); fi
          python -m woland collect "${args[@]}"

      # After a long catch-up, some headlines may still lack a translation; later runs finish the job.
      - name: Translate missing headlines
        run: python -m woland translate --days 45 --budget 30

      # Under Savvyboi's no-reply address, so the repository keeps a single contributor.
      - name: Commit new articles
        run: |
          git config user.name "woland-bot"
          git config user.email "123981133+Savvyboi@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "Nothing new."; exit 0; fi
          git commit -q -m "Collect $(date -u +%Y-%m-%d)"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase && git push -q && exit 0
            sleep $((attempt * 15))
          done
          exit 1

      # Every stored record well-formed and filed under its day (after committing, so a problem is
      # reported without holding back the day's collection).
      - name: Check the archive
        run: pip install -q pytest && python -m pytest -q tests/test_data.py

  deploy:
    needs: collect
    if: ${{ !cancelled() }}
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
