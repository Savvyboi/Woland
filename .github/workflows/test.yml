name: Tests

on:
  push:
    paths-ignore: ["data/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r requirements.txt pytest
      # Python units, the website's search code run in Node against a freshly built site, the interface
      # strings in all three languages, and the collected archive in data/.
      - run: python -m pytest -q
