name: Check outlets

# Can every outlet still be read from GitHub's servers? Discovers yesterday's articles for each outlet
# (disabled ones included) and reads a couple of pages, then lists the result in the run summary.
# Run it by hand after changing config/outlets.yaml; it also runs every Monday so that a site
# changing its layout or starting to block is noticed.

on:
  workflow_dispatch:
    inputs:
      outlets:
        description: "Only these outlets (comma-separated ids; empty = all)"
        default: ""
  schedule:
    - cron: "5 6 * * 1"   # Mondays 09:05 Moscow time

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check
        env:
          OUTLETS: ${{ inputs.outlets || '' }}
        run: |
          if [ -n "$OUTLETS" ]; then python -m woland check --outlets "$OUTLETS"; else python -m woland check; fi
