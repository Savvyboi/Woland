# Woland: who a headline's speaker is, for the "Who is cited" ledger (woland/sources.py, Analysis page).
#
# The speaker comes from the headline (woland/analysis.py: "Песков: …", "Лавров заявил…", "… – Lavrov"). Each is
# put in one of four buckets:
#   named_official    a named office holder (government, parliament, military, diplomacy, central bank, state
#                     corporations), Russian or foreign, or an institution speaking as one ("МИД", "Кремль")
#   named_other       anyone else named: commentators, ex-officials, public figures, and officials not listed here
#   anonymous_expert  a source or an expert left unnamed: "эксперт", "источник", "политолог", "врач", "sources"
#   cited_outlet      another outlet, a news agency or a Telegram channel
#
# officials   speakers' keys (the last word of the name, in lower case, as woland/analysis.voice_key gives it) of
#             office holders; a name preceded by an office ("Посол", "Генерал", "Minister") counts as well.
#             Listed by how often they speak: the 30 days to 26 November 2026 cover most named speakers.
# telegram    Telegram channels and other unregistered outlets, by key; with fringe, the sources whose citation by a
#             state outlet is shown as "fringe to state"
# fringe      the outlets Woland calls hardline (outlets.yaml group) are fringe too; these are added by key
# (citations of fringe sources by the outlets of the state group in outlets.yaml are flagged)

