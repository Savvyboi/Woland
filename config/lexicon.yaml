  - id: enemies-within
    label: {en: "Enemies within: 'foreign agents'", fi: "Sisäiset viholliset: ”ulkomaiset agentit”", sv: "Inre fiender: ”utländska agenter”"}
    about:
      en: Branding critics, émigrés and independent media as 'foreign agents', 'undesirable', 'extremist' or a 'fifth column'.
      fi: Kriitikoiden, emigranttien ja riippumattoman median leimaaminen ”ulkomaisiksi agenteiksi”, ”epätoivotuiksi”, ”ääriliikkeiksi” tai ”viidenneksi kolonnaksi”.
      sv: Att stämpla kritiker, emigranter och oberoende medier som ”utländska agenter”, ”oönskade”, ”extremister” eller en ”femte kolonn”.
    checked: {n: 25, fit: 19, date: '2026-09-28'}
    # "extremist organisation" is left out on purpose: Russian law makes outlets add it to every
    # mention of Meta, Instagram or Facebook, which would drown the signal. "Traitor" on its own is a
    # film title, South Korea on Zelensky or the Rada on Russian songs: only a traitor to the motherland.
    # The label Russian law requires after every name on the foreign-agent register ("признан в РФ
    # иностранным агентом", "внесён Минюстом России в реестр иноагентов", "физлицо, выполняющее функции
    # иноагента") and on the list of undesirable organisations ("признана нежелательной организацией")
    # does not count either: in the audit most matches were that label under stories about something else.
    # It is written in the passive voice, with a varying number of words in between (~). News of a
    # designation ("Минюст признал иноагентом", "внесли в реестр") does count; so, unavoidably, does a
    # footnote in the active voice.
    ru:
      - match: ['иноагент*', 'иностранн* агент*']
        not: ['признан* ~ иноагент*', 'признан* ~ сми-иноагент*', 'признан* ~ иностранн* агент*',
              'внесен* ~ в реестр ~ иноагент*', 'внесен* ~ в реестр ~ иностранн* агент*',
              'внесен* ~ в список ~ иноагент*', 'внесен* ~ в список ~ иностранн* агент*',
              'внесен* ~ в перечень ~ иноагент*', 'внесен* ~ в перечень ~ иностранн* агент*',
              'включен* ~ в реестр ~ иноагент*', 'включен* ~ в реестр ~ иностранн* агент*',
              'включен* ~ в список ~ иноагент*', 'включен* ~ в список ~ иностранн* агент*',
              'включен* ~ в перечень ~ иноагент*', 'включен* ~ в перечень ~ иностранн* агент*',
              'внесен* ~ в реестр сми-иноагент*', 'внесен* ~ в реестр организаций-иноагент*',
              'включен* ~ в реестр сми-иноагент*', 'включен* ~ в реестр организаций-иноагент*',
              'выполняющ* функци* иноагент*', 'выполняющ* функци* иностранн* агент*',
              'террорист* и экстремист* ~ иноагент*', 'террорист* и экстремист* ~ иностранн* агент*']
      - match: ['нежелательн* организац*']
        not: ['признан* ~ нежелательн* организац*', 'иноагент* ~ и нежелательн* организац*',
              'иностранн* агент* ~ и нежелательн* организац*']
      - 'пят* колонн*'
      - 'релокант*'
      - 'национал-предател*'
      - 'предател* родин*'
      - 'предательств* родин*'
      - 'предал* родин*'
      - 'предавш* родин*'
      - 'предател* россии'
      - 'предал* россию'
      - 'предавш* россию'
