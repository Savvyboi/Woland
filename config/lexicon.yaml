      en: Casting Ukraine, its army or its allies as Nazis or fascists; the stated war aim of 'denazification'.
      fi: Ukrainan, sen armeijan tai liittolaisten kuvaaminen natseina tai fasisteina; sodan julistettu tavoite ”denatsifikaatio”.
      sv: Att framställa Ukraina, dess armé eller allierade som nazister eller fascister; krigets uttalade mål ”denazifiering”.
    ru: ['нацист*', 'неонацист*', 'нео-нацист*', 'нацизм*', 'неонацизм*', 'денацифик*', 'фашист*', 'фашизм*', 'неофашист*', 'бандеров*', 'укронацист*', 'укрофашист*', 'нацбат*']
    en: ['nazi*', 'neo-nazi*', 'neonazi*', 'denazif*', 'fascis*', 'neofascis*', 'banderite*', 'banderist*', 'bandera']

