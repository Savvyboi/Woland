# Woland lexicon: the narratives and topics that every article is checked against.
#
# family: framing  = a loaded narrative or propaganda frame
#         topic    = a neutral subject, tracked for context
#
# Patterns are matched case-insensitively against the headline, the lead and (where Woland can read it)
# the full article text. Text is normalised first (lower case, ё → е).
#   нацист*          a word starting with "нацист" (нацисты, нацистов, нацистский …)
#   сво              exactly the word "сво"
#   киевск* режим*   a phrase: two consecutive words
#
# Editing this file changes the whole archive at the next build for headlines and leads. Full-text
# matches are recorded when an article is collected; see README → "Changing the lexicon".

framings:

  - id: svo
    label: {en: "'Special military operation'", fi: "”Erityinen sotilasoperaatio”", sv: "”Den militära specialoperationen”"}
    about:
      en: The official euphemism for the full-scale war against Ukraine.
      fi: Virallinen kiertoilmaus Ukrainaa vastaan käytävälle täysimittaiselle sodalle.
      sv: Den officiella eufemismen för det fullskaliga kriget mot Ukraina.
    ru: ['специальн* военн* операц*', 'сво', 'спецоперац*']
    en: ['special military operation*', 'special operation']

  - id: nazism
