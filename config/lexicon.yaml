  discredit:
    label: {en: "words that discredit", fi: "halventavat sanat", sv: "misskrediterande ord"}
    ru: ['ложь', 'лжи', 'ложью', 'лжив*', 'лжец*', 'ложн*', 'лгут', 'лгал*', 'лгать', 'вран*', 'врут', 'наврал*', 'фейк*', 'пропаганд*', 'клевет*', 'дезинформ*', 'замалчива*', 'умалчива*', 'истери*', 'травл*', 'манипул*', 'обман*', 'выдума*', 'сфабрик*', 'вброс*', 'ангажирован*', 'русофоб*', 'цензур*', 'искажа*', 'исказ*', 'шлак']
    en: ['lie', 'lies', 'lying', 'liar*', 'false*', 'fake*', 'propaganda', 'disinformation', 'misinformation', 'hysteria', 'smear*', 'slander*', 'manipulat*', 'fabricat*', 'distort*', 'russophob*', 'censor*', 'hoax*']

framings:

  - id: svo
    label: {en: "'Special military operation'", fi: "”Erityinen sotilasoperaatio”", sv: "”Den militära specialoperationen”"}
    about:
      en: The official euphemism for the full-scale war against Ukraine.
      fi: Virallinen kiertoilmaus Ukrainaa vastaan käytävälle täysimittaiselle sodalle.
      sv: Den officiella eufemismen för det fullskaliga kriget mot Ukraina.
    checked: {n: 25, fit: 25, date: '2026-09-27'}
    ru: ['специальн* военн* операц*', 'сво', 'спецоперац*']
    en: ['special military operation*', 'special operation']

  - id: nazism
    label: {en: "Nazis & 'denazification'", fi: "Natsit ja ”denatsifikaatio”", sv: "Nazister och ”denazifiering”"}
    about:
      en: Casting Ukraine, its army or its allies as Nazis or fascists; the stated war aim of 'denazification'.
      fi: Ukrainan, sen armeijan tai liittolaisten kuvaaminen natseina tai fasisteina; sodan julistettu tavoite ”denatsifikaatio”.
      sv: Att framställa Ukraina, dess armé eller allierade som nazister eller fascister; krigets uttalade mål ”denazifiering”.
    checked: {n: 25, fit: 22, date: '2026-09-27'}
    # The plain words also describe the Second World War, which the Russian press recalls almost daily:
    # they count only next to Ukraine, the war or the West, and not in the stock phrases of war memory.
    ru:
      - 'неонацист*'
      - 'нео-нацист*'
      - 'неонацизм*'
      - 'денацифик*'
      - 'неофашист*'
      - 'бандеров*'
      - 'укронацист*'
      - 'укрофашист*'
      - 'нацбат*'
      - match: ['нацист*', 'нацизм*', 'фашист*', 'фашизм*']
        with: [ukraine-war, the-west]
        not: ['немецко-фашистск*', 'немецк* фашист*', 'фашистск* захватчик*', 'нацистск* захватчик*', 'фашистск* оккупац*', 'нацистск* оккупац*', 'фашистск* оккупант*', 'нацистск* оккупант*', 'фашистск* концлагер*', 'нацистск* концлагер*', 'узник* фашистск*', 'узник* нацистск*', 'победа над фашизмом', 'победы над фашизмом', 'победу над фашизмом', 'победе над фашизмом', 'победой над фашизмом', 'победа над нацизмом', 'победы над нацизмом', 'победу над нацизмом', 'победе над нацизмом', 'победой над нацизмом', 'разгром* фашизм*', 'разгром* нацизм*']
    en:
      - 'neo-nazi*'
      - 'neonazi*'
      - 'denazif*'
      - 'neofascis*'
      - 'banderite*'
      - 'banderist*'
      - 'bandera'
      - match: ['nazi*', 'fascis*']
        with: [ukraine-war, the-west]
        not: ['victory over nazism', 'victory over fascism', 'defeat of nazism', 'defeat of fascism', 'defeated nazism', 'defeated fascism', 'nazi occupation', 'nazi invaders', 'nazi concentration camp*']

  - id: kyiv-regime
    label: {en: "'The Kyiv regime'", fi: "”Kiovan hallinto”", sv: "”Kievregimen”"}
    about:
      en: "Refusing to call Ukraine's government a government: 'Kyiv regime', 'Zelensky regime', 'junta'."
      fi: Ukrainan hallituksen kutsuminen ”hallinnoksi” tai ”juntaksi” – ”Kiovan hallinto”, ”Zelenskyin hallinto”.
      sv: Att vägra kalla Ukrainas regering för regering – ”Kievregimen”, ”Zelenskyjregimen”, ”juntan”.
    checked: {n: 25, fit: 25, date: '2026-09-27'}
    ru:
      - 'киевск* режим*'
      - 'режим* зеленск*'
      - 'киевск* хунт*'
      - 'неонацистск* режим*'
      - 'бандеровск* режим*'
      - {match: ['преступн* режим*', 'марионеточн* режим*'], with: ukraine-war}
    en:
      - 'kiev* regime*'
      - 'kyiv* regime*'
      - 'zelensky* regime*'
      - 'kiev junta'
      - 'neo-nazi regime*'
      - {match: ['puppet regime*', 'criminal regime*'], with: ukraine-war}

  - id: illegitimacy
    label: {en: "Zelensky 'illegitimate'", fi: "Zelenskyi ”epälegitiimi”", sv: "Zelenskyj ”illegitim”"}
    about:
      en: Claims that Ukraine's president lost his legitimacy when elections were postponed under martial law.
      fi: Väitteet, että Ukrainan presidentti menetti legitimiteettinsä, kun vaalit siirrettiin sotatilan vuoksi.
      sv: Påståenden om att Ukrainas president förlorade sin legitimitet när valen sköts upp under krigslagar.
    checked: {n: 25, fit: 25, date: '2026-09-27'}
    # "Illegitimate" is also said of sanctions, elections and airspace notices: only next to Ukraine's
    # president or government. ("Former president of Ukraine" found Kuchma, Yanukovych and Poroshenko.)
    ru:
      - 'просроченн* президент*'
      - {match: ['нелегитимн*', 'узурпатор*', 'узурпаци*'], with: kyiv-government}
    en:
      - 'expired president'
      - 'former president zelensky'
      - {match: ['illegitima*', 'usurp*'], with: kyiv-government}

  - id: collective-west
    label: {en: "'Collective West' & 'Anglo-Saxons'", fi: "”Kollektiivinen länsi” ja ”anglosaksit”", sv: "”Det kollektiva väst” och ”anglosaxarna”"}
    about:
      en: The West as one hostile bloc steering events; the 'Anglo-Saxons' as puppet-masters.
      fi: Länsi yhtenä vihamielisenä blokkina, joka ohjailee tapahtumia; ”anglosaksit” nukkemestareina.
      sv: Väst som ett enda fientligt block som styr händelserna; ”anglosaxarna” som marionettmästare.
    checked: {n: 25, fit: 25, date: '2026-09-27'}
    ru:
      - 'коллективн* запад*'
      - 'англосакс*'
      - 'западн* куратор*'
      - 'западн* хозя*'
      - 'куратор* киев*'
      - {match: ['кукловод*'], with: [ukraine-war, the-west]}
    en:
      - 'collective west'
      - 'anglo-saxon*'
      - 'western handlers'
      - 'western masters'
      - {match: ['puppet master*', 'puppeteer*'], with: [ukraine-war, the-west]}

  - id: russophobia
    label: {en: "Russophobia", fi: "Russofobia", sv: "Russofobi"}
    about:
      en: Criticism of Russia recast as irrational hatred of Russians, including 'cancelling Russian culture'.
      fi: Venäjän arvostelu esitetään järjettömänä vihana venäläisiä kohtaan, myös ”venäläisen kulttuurin kanselointina”.
      sv: Kritik mot Ryssland omtolkas som irrationellt hat mot ryssar, inklusive att ”cancellera rysk kultur”.
    checked: {n: 25, fit: 25, date: '2026-09-27'}
    ru: ['русофоб*', 'антироссийск* истери*', 'отмен* русск* культур*', 'культур* отмен*', 'дискриминац* русск*', 'дискриминац* русскоязычн*']
    en: ['russophob*', 'anti-russian hysteria', 'cancel* russian culture', 'discrimination against russian*']

  - id: provocation
    label: {en: "'Provocations' & staged events", fi: "”Provokaatiot” ja lavastukset", sv: "”Provokationer” och iscensättningar"}
    about:
      en: Claims, often in advance, that incidents are staged provocations or false-flag operations.
      fi: Usein ennakoivat väitteet, että tapahtumat ovat lavastettuja provokaatioita tai false flag -operaatioita.
      sv: Ofta förebyggande påståenden om att händelser är iscensatta provokationer eller false flag-operationer.
    checked: {n: 25, fit: 22, date: '2026-09-27'}
    # "Staged" is also a staged robbery or a stage adaptation (инсценировка), and TASS English "stages"
    # shelling attacks: only next to Ukraine, the war or the West.
    # "Провокационный" is also a pop video, a headline or a question: the adjective only next to Ukraine,
    # the war or the West.
    ru:
      - 'провокация'
      - 'провокации'
      - 'провокацию'
      - 'провокацией'
      - 'провокаций'
      - 'провокациям'
      - 'провокациями'
      - 'провокациях'
      - 'провокатор*'
      - 'ложн* флаг*'
      - {match: ['провокационн*', 'инсценир*', 'инсценировк*', 'постановочн*'], with: [ukraine-war, the-west]}
    en:
      - 'provocation*'
      - 'provocateur*'
      - 'false flag*'
      - 'false-flag*'
      - {match: ['staged incident*', 'staged provocation*', 'staged performance*', 'staged video*', 'staged footage', 'staged bucha', 'was staged', 'were staged'], with: [ukraine-war, the-west]}

  - id: western-fakes
    label: {en: "'Western fakes' & information war", fi: "”Lännen valeuutiset” ja informaatiosota", sv: "”Västliga fejknyheter” och informationskrig"}
    about:
      en: Dismissing reports as Western 'fakes' or 'information war'; independent media as an enemy weapon.
      fi: Uutisten kuittaaminen lännen ”valeuutisina” tai ”informaatiosotana”; riippumaton media vihollisen aseena.
      sv: Att avfärda rapporter som västliga ”fejknyheter” eller ”informationskrig”; oberoende medier som fiendens vapen.
    checked: {n: 25, fit: 14, date: '2026-09-28'}
    # Not counted: fake accounts, letters, exchanges, notices and giveaways used by fraudsters, ballot
    # stuffing and hockey face-offs (вброс),
    # Ukraine's own "Centre for Countering Disinformation", and Western accusations of Russian
    # disinformation. "Western media" is also a routine source ("according to Western media"): only
    # when the text discredits them.
    ru:
      - 'информационн* войн*'
      - 'информационн* атак*'
      - 'западн* пропаганд*'
      - {match: ['фейк*'], not: ['фейков* аккаунт*', 'фейков* страниц*', 'фейков* профил*', 'фейков* сайт*', 'фейков* письм*', 'фейков* писем', 'фейков* звонк*', 'фейков* магазин*', 'фейков* приложени*', 'фейков* ссылк*', 'фейков* чат*', 'фейков* номер*', 'фейков* взлом*', 'фейков* курьер*', 'фейков* сообщени* от имени', 'фейков* постановлени*', 'фейков* фото медвед*',
                                 'фейков* бирж*', 'фейков* интернет-бирж*', 'фейков* криптобирж*', 'фейков* уведомлен*', 'фейков* налогов* уведомлен*', 'фейков* объявлен*', 'фейков* розыгрыш*']}
      - {match: ['вброс*'], not: ['вброс* бюллетен*', 'вброс* на участк*', 'вброс* на избирательн*', 'вброс* шайб*', 'вброс* мяч*']}
      - {match: ['дезинформаци*'], not: ['центр* противодействи* дезинформаци*', 'пророссийск* дезинформаци*', 'российск* дезинформаци*', 'кремлевск* дезинформаци*', 'гибридн* атак* и дезинформаци*']}
      - {match: ['западн* сми', 'западн* медиа'], with: discredit}
    en:
      - 'information war*'
      - 'information attack*'
      - 'western propaganda'
      - {match: ['fake*'], not: ['fake account*', 'fake page*', 'fake profile*', 'fake website*', 'fake email*', 'fake call*', 'fake app*', 'fake government request*']}
      - {match: ['disinformation'], not: ['russian disinformation', 'pro-russian disinformation', 'kremlin disinformation', 'center for countering disinformation', 'centre for countering disinformation']}
      - {match: ['western media', 'mainstream media'], with: discredit}

  - id: terrorism
    label: {en: "Ukraine as 'terrorist state'", fi: "Ukraina ”terroristivaltiona”", sv: "Ukraina som ”terroriststat”"}
    about:
      en: Labelling Ukrainian military action as terrorism and Ukraine as a terrorist state.
      fi: Ukrainan sotilaallisten toimien leimaaminen terrorismiksi ja Ukrainan terroristivaltioksi.
      sv: Att stämpla ukrainska militära handlingar som terrorism och Ukraina som en terroriststat.
    checked: {n: 25, fit: 23, date: '2026-09-27'}
    # A terrorist attack in Dagestan, Pakistan or on 11 September is not this framing: "terrorist act" and
    # "terrorist state" count only next to Ukraine, its army, drones or the war.
    ru:
      - 'киевск* террорист*'
      - 'украинск* террорист*'
      - 'терроризм* киев*'
      - {match: ['теракт*', 'террористическ* акт*', 'террористическ* атак*', 'террористическ* режим*', 'террористическ* государств*'], with: ukraine-war}
    en:
      - 'ukrainian terrorist*'
      - 'kiev* terrorist*'
      - {match: ['terrorist attack*', 'terror attack*', 'act* of terror*', 'terrorist regime*', 'terrorist state'], with: ukraine-war}

  - id: mercenaries
    label: {en: "'Foreign mercenaries'", fi: "”Ulkomaiset palkkasoturit”", sv: "”Utländska legosoldater”"}
    about:
      en: Presenting foreign volunteers and Western involvement as mercenaries fighting for Kyiv.
      fi: Ulkomaisten vapaaehtoisten ja lännen osallistumisen esittäminen Kiovan palkkasotureina.
      sv: Att framställa utländska frivilliga och västligt engagemang som legosoldater i Kievs tjänst.
    checked: {n: 25, fit: 21, date: '2026-09-27'}
    ru:
      - 'наемник*'
      - 'иностранн* легион*'
      - 'западн* инструктор*'
      - 'натовск* инструктор*'
      - {match: ['иностранн* боевик*'], with: ukraine-war}
    en:
      - 'mercenar*'
      - 'foreign legion'
      - 'western instructors'
      - 'nato instructors'
      - {match: ['foreign fighters'], with: ukraine-war}

  - id: biolabs
    label: {en: "US 'biolabs'", fi: "Yhdysvaltain ”biolaboratoriot”", sv: "USA:s ”biolaboratorier”"}
    about:
      en: The long-running claim of secret US military biological laboratories in Ukraine and elsewhere.
      fi: Pitkäikäinen väite Yhdysvaltain salaisista sotilaallisista biolaboratorioista Ukrainassa ja muualla.
      sv: Det långlivade påståendet om hemliga amerikanska militära biolaboratorier i Ukraina och på andra håll.
    checked: {n: 25, fit: 24, date: '2026-09-27'}
    # A biolab is also an AI company's drug laboratory, and "biological weapons" were mostly North Korea's
    # law and Baltic insurance policies: laboratories only next to Ukraine or the West, weapons not at all.
    ru:
      - 'военно-биологическ*'
      - {match: ['биолаборатор*', 'биологическ* лаборатор*'], with: [ukraine-war, the-west]}
    en:
      - 'military-biological'
      - {match: ['biolab*', 'bio-lab*', 'biological laborator*'], with: [ukraine-war, the-west]}

  - id: nuclear-threat
    label: {en: "Nuclear threats & 'superweapons'", fi: "Ydinuhkailu ja ”superaseet”", sv: "Kärnvapenhot och ”supervapen”"}
    about:
      en: Nuclear sabre-rattling, 'dirty bomb' claims and the celebration of new strategic weapons.
      fi: Ydinaseilla uhkailu, ”likaisen pommin” väitteet ja uusien strategisten aseiden ylistys.
