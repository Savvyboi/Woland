    ru: ['помощ*', 'деньг*', 'денег', 'средств*', 'миллиард*', 'миллион*', 'транш*', 'финансир*', 'кредит*', 'налогоплательщик*', 'бюджет*', 'оружи*', 'поставк*', 'евро', 'доллар*']
    en: ['aid', 'money', 'funds', 'funding', 'billion*', 'million*', 'tranche*', 'financ*', 'loan*', 'taxpayer*', 'budget*', 'weapon*', 'arms', 'supplies']

  russia-and-adversaries:
    label: {en: "Russia and its adversaries", fi: "Venäjä ja sen vastustajat", sv: "Ryssland och dess motståndare"}
    ru: ['росси*', 'рф', 'москв*', 'кремл*', 'нато', 'европ*', 'евросоюз*', 'запад*', 'украин*', 'киев*', 'британ*', 'лондон*', 'польш*', 'варшав*', 'прибалт*', 'литв*', 'латви*', 'эстони*', 'финлянди*', 'германи*', 'берлин*', 'франци*', 'париж*']
    en: ['russia*', 'moscow', 'kremlin', 'nato', 'europe*', 'eu', 'west*', 'ukrain*', 'kiev*', 'kyiv*', 'brit*', 'london', 'poland', 'polish', 'warsaw', 'baltic*', 'lithuania*', 'latvia*', 'estonia*', 'finland', 'german*', 'berlin', 'france', 'french', 'paris']

  strategic-weapons:
    label: {en: "strategic weapons", fi: "strategiset aseet", sv: "strategiska vapen"}
    ru: ['ракет*', 'мбр', 'ядерн*', 'боеголовк*', 'торпед*', 'подлодк*', 'подводн* лодк*', 'стратегическ*', 'радиоактивн*']
