# Woland lexicon: the narratives and topics that every article is checked against.
#
# family: framing  = a loaded narrative or propaganda frame
#         topic    = a neutral subject, tracked for context
#
# Patterns are matched case-insensitively against the headline, the lead and (where Woland can read it)
# the full article text. Text is normalised first (lower case, ё → е).
#   нацист*          a word starting with "нацист" (нацисты, нацистов, нацистский …)
#   сво              exactly the word "сво"
#   киевск* режим*   a phrase: two consecutive words
#   признан* ~ иноагент*   ~ stands for up to three words of any kind (and a quotation mark or bracket
#                    before the next word): "признан Минюстом России иноагентом", "признана «иноагентом»"
#
# Words that are propaganda in one context and ordinary news in another are written as a group:
#   - {match: ['теракт*'], with: ukraine-war}
#         counts only when the same headline and lead also contain a word from the `ukraine-war` list
#         below (or from a topic, by its id). In the full text the word must be within 50 characters,
#         so that the stored snippet shows it.
#   - {match: ['вброс*'], not: ['вброс* бюллетен*']}
#         does not count when the match is part of one of these phrases ("ballot stuffing").
#
# Matching is lexical: an article that quotes, reports or rebuts a claim counts too. The `checked` entries
# record how many of a random sample of 25 matches fit the definition when they were read (who read them,
# and how: docs/lexicon-audit.md); re-check a fresh sample after changing a framing's patterns.
#
# Editing this file changes the whole archive at the next build for headlines and leads. Full-text
# matches are recorded when an article is collected; see README → "Configuration".

