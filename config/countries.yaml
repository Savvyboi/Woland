# Countries for the Analysis page: which countries an article's headline and lead name.
#
# For every country (ISO 3166-1 alpha-2 code): the words that count as naming it, in Russian (`ru`) and English
# (`en`): its names, the adjective, the people, and for the countries in the news most often the capital, which
# both presses use for the government ("Киев заявил", "Washington says"). Russian words are written in their
# dictionary form and matched in every form (pymorphy3's lemmas, as for rising words); English words are matched
# as written, with "s" for the plural where it applies. A word written with a capital letter counts only when
# the text capitalises it too ("Чад" the country, not "чад" the fumes); one written in lower case counts either
# way (adjectives, which start a headline with a capital); one written in capitals (США, US) only in capitals.
#
# Left out because they mean too many other things: "Корея" alone (which one?), "Штаты", "РК", "Georgia"'s
# American namesake cannot be told apart (counted as the country), "Jordan" may be a person. Russia is counted
# like any other country but drawn apart on the map: it is the home country of nearly every article.

