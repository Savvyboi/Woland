  - id: regnum
    name: Regnum
    name_ru: Регнум
    lang: ru
    group: hardline
    home: https://regnum.ru
    eu_blocked: false
    # Its article pages answer 403 to automated readers, from Finland and from GitHub's servers alike, and
    # the Internet Archive's copies of its news are 403 pages too. Its feed answers 403 in Finland (robots.txt
    # as well), but GitHub's servers read it on 29 September 2026: 218 items, about a day. robots.txt (the
    # Archive's copy of 10 September 2026) closes only /search, /pdfnews/, /pdf/article/ and /sneakpeek.
    # So, like TASS, it is read from its feed only: headline, lead (cut off by the feed) and time, no texts.
    fetch: false
    poll: true
    about:
      en: News agency with a nationalist editorial line.
      fi: Nationalistisen linjan uutistoimisto.
      sv: Nyhetsbyrå med nationalistisk linje.
    note:
      en: 'Read from its own feed only, which holds about a day of news: collected from 29 September 2026, when its feed first answered Woland (its pages refuse automated readers). Headlines and leads, no texts. The Internet Archive holds only error pages for its news, so earlier days cannot be filled in.'
      fi: 'Luetaan vain median omasta syötteestä, jossa on noin vuorokauden uutiset: kerätty 29.9.2026 alkaen, jolloin sen syöte ensimmäisen kerran vastasi Wolandille (sen sivut torjuvat automaattiset lukijat). Otsikot ja ingressit, ei tekstejä. Internet Archivessa on sen uutisista vain virhesivuja, joten aiempia päiviä ei voi täydentää.'
      sv: 'Läses bara från mediets eget flöde, som rymmer ungefär ett dygns nyheter: insamlat från den 29 september 2026, då flödet för första gången svarade Woland (sidorna nekar automatiserade läsare). Rubriker och ingresser, inga texter. Internet Archive har bara felsidor för dess nyheter, så tidigare dagar kan inte fyllas i.'
    article: '^https://regnum\.ru/(news|article)/\d+$'
    sources:
      - {type: rss, url: 'https://regnum.ru/rss'}
