      - {type: sitemap_index, url: 'https://tass.com/sitemap.xml', child: 'sitemap_news\d+\.xml$', order: asc, max_children: 2}

  - id: sputnik
    name: Sputnik Globe
    name_ru: Sputnik (англ.)
    lang: en
    group: foreign
    home: https://sputnikglobe.com
    eu_blocked: true
    about:
      en: International English-language brand of Rossiya Segodnya (formerly Sputnik News).
      fi: Rossija Segodnjan kansainvälinen englanninkielinen brändi (aiemmin Sputnik News).
      sv: Rossija Segodnjas internationella engelskspråkiga varumärke (tidigare Sputnik News).
    note:
      en: 'Blocked on the network in Finland where Woland was set up, and it does not answer GitHub''s servers, where the collection runs, either (since 27 September 2026). Only the articles the Internet Archive has captured are read, from its copies: some 15–30 a day in September 2026, a fraction of what Sputnik publishes.'
      fi: 'Estetty Suomessa siinä verkossa, jossa Woland perustettiin, eikä se vastaa myöskään GitHubin palvelimille, joilla keruu toimii (27.9.2026 alkaen). Vain Internet Archiven tallentamat artikkelit luetaan sen kopioista: syyskuussa 2026 noin 15–30 päivässä, murto-osa Sputnikin julkaisuista.'
      sv: 'Blockerad i det finländska nätverk där Woland sattes upp, och den svarar inte heller GitHubs servrar, där insamlingen körs (sedan den 27 september 2026). Bara de artiklar som Internet Archive har sparat läses, från dess kopior: omkring 15–30 om dagen i september 2026, en bråkdel av vad Sputnik publicerar.'
    # Every connection timed out from GitHub's servers on 27 September 2026, as from Finland. The pages the
    # Internet Archive captured are read from its copies.
    article: '^https://sputnikglobe\.com/\d{8}/[^/]+\.html$'
    sources:
      - {type: sitemap, per: day, url: 'https://sputnikglobe.com/sitemap_article.xml?date_start={ymd}&date_end={ymd}'}
      - {type: wayback, every_run: true, per: month, prefix: 'sputnikglobe.com/{y}{mm}'}

