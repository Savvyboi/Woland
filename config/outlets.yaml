  - id: tass-en
    name: TASS (English)
    name_ru: ТАСС (англ.)
    lang: en
    group: foreign
    home: https://tass.com
    eu_blocked: false
    about:
      en: English-language service of the TASS state news agency.
      fi: Valtiollisen TASS-uutistoimiston englanninkielinen palvelu.
      sv: Den engelskspråkiga tjänsten från den statliga nyhetsbyrån TASS.
