      en: 'Published about half as many items a day until 8 September 2026 as from 9 September: its own sitemaps list mostly 300–470 a weekday in August and early September, and 650–830 since. The lower counts of early September are not a gap in collection.'
      fi: 'Julkaisi 8.9.2026 asti noin puolet vähemmän juttuja päivässä kuin 9.9. alkaen: sen omat sivukartat luettelevat elokuussa ja syyskuun alussa enimmäkseen 300–470 juttua arkipäivänä ja sen jälkeen 650–830. Syyskuun alun pienemmät määrät eivät ole aukko keruussa.'
      sv: 'Publicerade ungefär hälften så många inslag om dagen fram till den 8 september 2026 som från den 9 september: dess egna webbplatskartor listar mest 300–470 per vardag i augusti och början av september, och 650–830 därefter. De lägre siffrorna i början av september är ingen lucka i insamlingen.'
