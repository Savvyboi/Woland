# Woland: the outlets under observation.
#
# Every outlet has:
#   id          short stable identifier (used in file names; never change it once data exists)
#   name/name_ru display names
#   lang        language of the content: ru | en
#   group       state | mass | foreign | hardline | official
#   home        homepage
#   eu_blocked  true if the site is blocked in the EU under the sanctions broadcasting ban
#               (observed via ISP-level DNS blocking in Finland, 24 Sept 2026)
#   about       one-sentence description in en / fi / sv
#   note        (optional) what readers should know about its coverage, in en / fi / sv (Outlets page)
#   fetch       true  = open every article page (headline, lead, full text for narrative tagging)
#               false = feed-only: the article pages refuse automated readers (JavaScript bot checks or
#                       errors, which Woland does not try to get around), so only the outlet's own feed is used
#   rate        minimum seconds between two requests to this outlet (politeness)
#   article     regular expression an article URL must match
#   sources     where article URLs are discovered. Types:
#                 sitemap        url template, expanded per day | month | year | once
#                 sitemap_index  walk the children of a sitemap index (newest first) until older than the range
#                 rss            one or more feeds; a url with {n} is a paged feed, read from page `first`
#                                up to `pages` until the pages are older than the range
#                 html_list      listing pages: per day (…/2026/09/03/, continued by `next`), numbered
#                                ({n}) or continued from the oldest item seen so far ({cursor}, Unix time).
#                                `item` is a pattern with the named groups url, title, ts or date; dated
#                                listings are read back until they pass the start of the range
#                 wayback        article URLs the Internet Archive captured (backfill only, unless
#                                `every_run: true`). The pages themselves are read from the outlet — or,
#                                while the outlet does not answer at all, from the Archive's copy (the
#                                record then carries `ar`, the time of the capture). `prefix` (one, or a
#                                list) may carry date placeholders (one query per `per` period); `walk`
#                                steps down through sequential numeric ids, starting below the oldest id
#                                listed on that page
#               Placeholders: {y} {m} {mm} {d} {dd} {ymd} {msk_start} {msk_end} {n} {cursor}
#               A source marked backfill_only is only read when collecting days older than the rolling
#               week that every nightly run looks at again.
#   poll        true = also polled hourly by the light "poll" workflow (feeds that only hold a few hours)
#   feed_fulltext  feed-only, but the feed carries the complete texts (so framings are found in the body)
#   tz_fix      the site writes Moscow wall-clock time but declares another UTC offset; trust the clock
#   parallel    how many article pages to fetch at once (default 2; the per-host pause still applies)
#   budget      the most minutes one run spends on this outlet (default: the run's own budget), so that a
#               slow site does not hold up the nightly run and the website's update
#   cookies     cookies that an anonymous visitor's browser would hold for the site (see Gazeta.ru)
#   headline    meta (default: og:title and the like) | h1 (the visible headline, when meta titles are SEO text)
#   coverage_sitemap  a sitemap used only to count how many articles the outlet published per day
#   gaps        for a feed-only outlet whose feeds roll over between two readings: {minutes, skip}. A silence
#               longer than `minutes` between two stored articles (URLs matching the pattern `skip` aside:
#               sections a feed of their own covers for longer) is shown as hours not collected
#   video       a pattern for the URLs of video items, whose text is only a caption: labelled "video" on the site
#   enabled     false = skipped (kept for documentation)

defaults:
  rate: 0.6
  fetch: true
  enabled: true

outlets:

  # ── State core ──────────────────────────────────────────────────────────────
  - id: ria
    name: RIA Novosti
    name_ru: РИА Новости
    lang: ru
    group: state
    home: https://ria.ru
    eu_blocked: true
    about:
      en: State news agency, part of the Rossiya Segodnya media group created by presidential decree in 2013.
      fi: Valtiollinen uutistoimisto, osa presidentin asetuksella vuonna 2013 perustettua Rossija Segodnja -mediakonsernia.
      sv: Statlig nyhetsbyrå, del av mediekoncernen Rossija Segodnja som skapades genom presidentdekret 2013.
    article: '^https://ria\.ru/\d{8}/[^/]+\.html$'
    sources:
      - {type: sitemap, per: day, url: 'https://ria.ru/sitemap_article.xml?date_start={ymd}&date_end={ymd}'}

  - id: tass
    name: TASS
    name_ru: ТАСС
    lang: ru
    group: state
    home: https://tass.ru
    eu_blocked: false
    about:
      en: Russia's central state news agency (Russian-language service).
      fi: Venäjän keskeinen valtiollinen uutistoimisto (venäjänkielinen palvelu).
      sv: Rysslands centrala statliga nyhetsbyrå (ryskspråkig tjänst).
    note:
      en: 'Read from its own feeds only, as its pages refuse automated readers: headline, lead and time, and since 30 September 2026 the full text of most news too, in which framings are looked for as well. The feeds hold from a few hours to about a day of news and cannot be read backwards, so TASS is collected from 24 September 2026, when hourly reading began. Until 30 September its feed held only three hours, and GitHub started the hourly reading only every few hours; since 8 October its fullest feed has often refused Woland, and from 10 October its section feeds are read as well. The hours lost are listed below.'
      fi: 'Luetaan vain median omista syötteistä, koska sen sivut torjuvat automaattiset lukijat: otsikko, ingressi ja aika sekä 30.9.2026 alkaen myös useimpien uutisten koko teksti, josta etsitään myös narratiiveja. Syötteissä on muutaman tunnin – noin vuorokauden uutiset, eikä niitä voi lukea takautuvasti, joten TASS on kerätty 24.9.2026 alkaen, jolloin tunneittainen lukeminen alkoi. Ennen 30.9. syötteessä oli vain kolmen tunnin uutiset, ja GitHub käynnisti tunneittaisen lukemisen vain muutaman tunnin välein; 8.10. alkaen kattavin syöte on usein torjunut Wolandin, ja 10.10. alkaen luetaan myös osastojen syötteet. Menetetyt tunnit luetellaan alla.'
      sv: 'Läses bara från mediets egna flöden, eftersom sidorna nekar automatiserade läsare: rubrik, ingress och tid samt från den 30 september 2026 även hela texten för de flesta nyheter, där narrativ också söks. Flödena rymmer från några timmars till ungefär ett dygns nyheter och kan inte läsas i efterhand, så TASS samlas in från den 24 september 2026, då läsningen varje timme började. Före den 30 september rymde flödet bara tre timmar, och GitHub startade läsningen bara med några timmars mellanrum; sedan den 8 oktober har det fylligaste flödet ofta nekat Woland, och från den 10 oktober läses även avdelningarnas flöden. De förlorade timmarna listas nedan.'
    # Article pages, sitemaps and robots.txt answer 403 ("if you are not a bot…"), and the Internet
    # Archive's copies are the same 403 page; the feeds answer (robots.txt, in the Archive's copy of
    # 1 May 2026, closes only /search, /preview/, /n/, */api/* and /video/). None can be read backwards or
    # paged, so TASS's Russian service starts with the first hourly run. On 29 September 2026 at 23:00
    # Moscow time the feed for news aggregators held 656 items, back to 10:00, with their full texts —
    # everything but sport and science; the sport section's own feed (sections= takes TASS's section ids,
    # base64-encoded: 2176 is sport) about a day; the main feed 100 items, back to 19:37.
    fetch: false
    feed_fulltext: true
    poll: true
    article: '^https?://tass\.ru/[a-z0-9_-]+/\d+$'
    # The stored articles, sport and science aside, have never been more than ~27 minutes apart (at night)
    # while the feeds were read in time; each hour lost to a late reading left a silence of 50 minutes or more.
    # (With the section feeds below, which reach back further than the main feed, a loss confined to the
    # sections without a feed of their own — the army, space, the regions — may leave no such silence.)
    gaps: {minutes: 45, skip: '^https?://tass\.ru/(sport|nauka)/'}
    # From 8 October 2026 the feed for news aggregators answered GitHub with 403 more often than not (3 of 5
    # readings on 9 October; on 10 October every TASS feed answered 403 to Finland) while the main and sport
    # feeds answered: ~7 hours were lost on 9 October, 87% of the articles in six sections whose own feeds
    # (v2.xml?sections= the section's id in base64: 22 world, 23 politics, 24 society, 25 economy, 27 incidents,
    # 28 culture; an unknown id gives the main feed) are read as well from 10 October.
    sources:
      - type: rss
        url: ['https://tass.ru/rss/yandex.xml', 'https://tass.ru/rss/v2.xml?sections=MjE3Ng%3D%3D',
              'https://tass.ru/rss/v2.xml?sections=MjI%3D', 'https://tass.ru/rss/v2.xml?sections=MjM%3D',
              'https://tass.ru/rss/v2.xml?sections=MjQ%3D', 'https://tass.ru/rss/v2.xml?sections=MjU%3D',
              'https://tass.ru/rss/v2.xml?sections=Mjc%3D', 'https://tass.ru/rss/v2.xml?sections=Mjg%3D',
              'https://tass.ru/rss/v2.xml']

  - id: rt-ru
    name: RT (Russian)
    name_ru: RT на русском
    lang: ru
    group: state
    home: https://russian.rt.com
    eu_blocked: true
    about:
      en: Russian-language service of the state-funded RT network.
      fi: Valtion rahoittaman RT-verkon venäjänkielinen palvelu.
      sv: Den ryskspråkiga tjänsten inom det statligt finansierade nätverket RT.
    article: '^https://russian\.rt\.com/[a-z_]+/(news|article)/\d+-[^/]+$'
    sources:
      - {type: sitemap_index, url: 'https://russian.rt.com/sitemap.xml', child: 'sitemap_{y}(_\d+)?\.xml$', order: lastmod, max_children: 4}

  - id: rg
    name: Rossiyskaya Gazeta
    name_ru: Российская газета
    lang: ru
    group: state
    home: https://rg.ru
    eu_blocked: true
    about:
      en: Official newspaper of the Russian government, in which laws are promulgated.
      fi: Venäjän hallituksen virallinen sanomalehti, jossa lait julkaistaan.
      sv: Den ryska regeringens officiella tidning, där lagar kungörs.
    note:
      en: 'Its DDoS shield answers bursts of requests with a CAPTCHA, which Woland never solves: its pages are read slowly, and headlines and leads come from its feed every hour in the meantime.'
      fi: 'Sen palvelunestosuoja vastaa pyyntöryöppyihin CAPTCHA-tehtävällä, jota Woland ei koskaan ratkaise: sivut luetaan hitaasti, ja otsikot ja ingressit saadaan sillä välin syötteestä tunneittain.'
      sv: 'Dess DDoS-skydd svarar på skurar av förfrågningar med en CAPTCHA, som Woland aldrig löser: sidorna läses långsamt, och rubriker och ingresser hämtas under tiden från flödet varje timme.'
    tz_fix: true   # rg.ru labels Moscow time as UTC
    # Behind Qrator, which answers bursts of requests with a CAPTCHA page (HTTP 401) for a while: read it
    # gently. Its feed (~6 hours, headlines and leads) is not challenged and is read every hour, so that
    # headlines and leads are kept even while the pages are refused.
    rate: 1.0
    parallel: 1
    poll: true
    article: '^https://rg\.ru/\d{4}/\d{2}/\d{2}/[^?#]+\.html$'
    sources:
      - {type: rss, url: 'https://rg.ru/xml/index.xml'}
      - {type: sitemap, per: day, url: 'https://rg.ru/sitemaps/index.xml?date_start={msk_start}&date_end={msk_end}'}

  - id: iz
    name: Izvestia
    name_ru: Известия
    lang: ru
    group: state
    home: https://iz.ru
    eu_blocked: true
    about:
      en: Daily newspaper and news site owned by the National Media Group.
      fi: Päivälehti ja uutissivusto, jonka omistaa National Media Group.
      sv: Dagstidning och nyhetssajt som ägs av National Media Group.
    note:
      en: 'About one item in seven is a video (labelled so), with only a caption of a few dozen words for text and mostly without a lead.'
      fi: 'Noin joka seitsemäs juttu on video (merkitty sellaiseksi), jonka tekstinä on vain muutaman kymmenen sanan kuvateksti ja jolta useimmiten puuttuu ingressi.'
      sv: 'Ungefär vart sjunde inslag är en video (märkt som sådan) med bara en bildtext på några dussin ord som text och oftast utan ingress.'
    article: '^https://iz\.ru/\d+/[^?#]+$'
    video: '^https://iz\.ru/\d+/video/'   # 1,727 of 12,271 items in September 2026, 1,610 of them without a lead
    sources:
      - {type: sitemap_index, url: 'https://iz.ru/sitemap.xml', child: '/export/sitemap/(last|\d+)/xml$', order: desc, max_children: 4}

  - id: vesti
    name: Vesti
    name_ru: Вести
    lang: ru
    group: state
    home: https://www.vesti.ru
    eu_blocked: true
    about:
      en: News site of VGTRK, the state broadcaster behind the Rossiya-1 and Rossiya-24 channels.
      fi: Valtiollisen VGTRK-yhtiön uutissivusto; yhtiö lähettää Rossija-1- ja Rossija-24-kanavia.
      sv: Nyhetssajt för det statliga VGTRK, som står bakom kanalerna Rossija-1 och Rossija-24.
    article: '^https://www\.vesti\.ru/(ns|article)/[^?#]+$'
    sources:
      - {type: sitemap, per: once, url: 'https://www.vesti.ru/sitemap-news.xml'}   # the newest 1,000
      # The full archive, spread over ~32 files of ~5 MB (not in date order): read only to fill older gaps.
      - {type: sitemap_index, url: 'https://www.vesti.ru/sitemap.xml', child: 'sitemap-article-\d+\.xml$', order: lastmod, max_children: 40, backfill_only: true}

  - id: zvezda
    name: Zvezda
    name_ru: Звезда
    lang: ru
    group: state
    home: https://tvzvezda.ru
    eu_blocked: true
    about:
      en: TV channel and news site of the Russian Ministry of Defence.
      fi: Venäjän puolustusministeriön televisiokanava ja uutissivusto.
      sv: Det ryska försvarsministeriets tv-kanal och nyhetssajt.
    note:
      en: 'Early September 2026 comes from the Internet Archive''s captures (about 70% of its news), and so do 21–23 September.'
      fi: 'Syyskuun 2026 alku on peräisin Internet Archiven tallenteista (noin 70 % uutisista), samoin 21.–23.9.'
      sv: 'Början av september 2026 kommer från Internet Archives sparade sidor (ungefär 70 % av nyheterna), liksom 21–23 september.'
    poll: true
    article: '^https?://(www\.)?tvzvezda\.ru/news/[^?#]+\.html$'
    sources:
      - {type: rss, url: ['https://tvzvezda.ru/export/rss.xml', 'https://tvzvezda.ru/export/yandex.xml']}   # the second: ~24 hours
      # The news listing is drawn by JavaScript from /api, which robots.txt closes, and there is no sitemap.
      # Older days come from the Internet Archive; URLs carry the date (…/news/2026924…), so one query a month.
      - {type: wayback, prefix: 'tvzvezda.ru/news/{y}{m}', per: month}

  # ── Official line ───────────────────────────────────────────────────────────
  - id: kremlin
    name: Kremlin.ru
    name_ru: Кремль
    lang: ru
    group: official
    home: http://kremlin.ru
    eu_blocked: false
    about:
      en: Official website of the President of Russia; the reference point for the Kremlin's own line.
      fi: Venäjän presidentin virallinen verkkosivusto – vertailukohta Kremlin omalle linjalle.
      sv: Rysslands presidents officiella webbplats – referenspunkt för Kremls egen linje.
    note:
      en: 'Most records from September 2026 have no lead, because the feed''s summaries were empty; later records take the opening paragraph of the feed''s full text.'
      fi: 'Useimmista syyskuun 2026 tietueista puuttuu ingressi, koska syötteen tiivistelmät olivat tyhjiä; myöhemmät tietueet käyttävät syötteen koko tekstin ensimmäistä kappaletta.'
      sv: 'De flesta posterna från september 2026 saknar ingress eftersom flödets sammanfattningar var tomma; senare poster tar första stycket ur flödets fullständiga text.'
    poll: true
    fetch: false   # article pages answer 403 to automated readers; the Atom feed carries the full text
    feed_fulltext: true
    tz_fix: true   # the feed labels Moscow time "+04:00" (the pre-2014 offset)
    rate: 2
    article: '^https?://kremlin\.ru/events/[a-z_/-]+/\d+$'
    sources:
      - {type: rss, url: 'http://kremlin.ru/events/all/feed'}
      - {type: rss, url: 'http://kremlin.ru/events/all/feed/page/{n}', first: 2, pages: 80, backfill_only: true}

  - id: kremlin-en
    name: Kremlin.ru (English)
    name_ru: Кремль (англ.)
    lang: en
    group: official
    home: http://en.kremlin.ru
    eu_blocked: false
    about:
      en: English version of the Russian President's website.
      fi: Venäjän presidentin verkkosivuston englanninkielinen versio.
      sv: Den engelska versionen av den ryska presidentens webbplats.
    poll: true
    fetch: false   # as for kremlin.ru: the Atom feed carries the full text
    feed_fulltext: true
    tz_fix: true
    rate: 2
    article: '^https?://en\.kremlin\.ru/events/[a-z_/-]+/\d+$'
    sources:
      - {type: rss, url: 'http://en.kremlin.ru/events/all/feed'}
      - {type: rss, url: 'http://en.kremlin.ru/events/all/feed/page/{n}', first: 2, pages: 60, backfill_only: true}

  - id: pnp
    name: Parlamentskaya Gazeta
    name_ru: Парламентская газета
    lang: ru
    group: official
    home: https://www.pnp.ru
    eu_blocked: false
    about:
      en: Official newspaper of Russia's Federal Assembly (parliament).
      fi: Venäjän liittokokouksen (parlamentin) virallinen sanomalehti.
      sv: Den officiella tidningen för Rysslands federala församling (parlamentet).
    article: '^https://www\.pnp\.ru/[a-z0-9-]+/[^/?#]+\.html$'
    sources:
      - {type: sitemap_index, url: 'https://www.pnp.ru/site-map/sitemap_index.xml', child: 'sitemap_\d+\.xml$', order: asc, max_children: 2}

  # ── Pro-Kremlin mass press ──────────────────────────────────────────────────
  - id: kp
    name: Komsomolskaya Pravda
    name_ru: Комсомольская правда
    lang: ru
    group: mass
    home: https://www.kp.ru
    eu_blocked: false
    about:
      en: Mass-circulation tabloid with one of Russia's largest online audiences.
      fi: Laajalevikkinen iltapäivälehti, jolla on yksi Venäjän suurimmista verkkoyleisöistä.
      sv: Kvällstidning med en av Rysslands största publiker på nätet.
    note:
      en: '1–22 September 2026 comes from the Internet Archive''s captures (about 60% of its online news): KP''s own listings reach back only two days for news and two weeks for newspaper articles, which therefore begin on 10 September.'
      fi: '1.–22.9.2026 on peräisin Internet Archiven tallenteista (noin 60 % verkkouutisista): KP:n omat listaukset ulottuvat uutisissa vain kaksi päivää ja lehtiartikkeleissa kaksi viikkoa taaksepäin, joten lehtiartikkelit alkavat 10.9.'
      sv: '1–22 september 2026 kommer från Internet Archives sparade sidor (ungefär 60 % av nätnyheterna): KP:s egna listor når bara två dagar bakåt för nyheter och två veckor för tidningsartiklar, som därför börjar den 10 september.'
    article: '^https://www\.kp\.ru/(online/news|daily/\d+)/\d+/$'
    sources:
      # news_*: the newest 1,000 online news (about two days); main_*: newspaper articles (about two weeks)
      - {type: sitemap_index, url: 'https://www.kp.ru/sitemap.xml.gz', child: '/sitemap/(news|main)_\d+\.xml$', order: lastmod, max_children: 6}
      # Older online news: the ids are sequential, so walk down from the oldest id in the sitemap through
      # the Internet Archive's captures (about 60% of KP's news were captured in September 2026).
      - {type: wayback, prefix: 'www.kp.ru/online/news/', walk: 'https://www.kp.ru/sitemap/news_02.xml', block: 1000}

  - id: aif
    name: Argumenty i Fakty
    name_ru: Аргументы и факты
    lang: ru
    group: mass
    home: https://aif.ru
    eu_blocked: false
    about:
      en: Weekly newspaper and news site, owned by the Moscow city government since 2014.
      fi: Viikkolehti ja uutissivusto, jonka omistaa Moskovan kaupunki vuodesta 2014.
      sv: Veckotidning och nyhetssajt som sedan 2014 ägs av Moskvas stadsförvaltning.
    article: '^https://aif\.ru/[a-z_]+(/[a-z_]+)*/[^/?#]+$'
    sources:
      - {type: rss, url: 'https://aif.ru/rss/news.php'}   # the last ~300, about a day
      # The sitemaps are regenerated only now and then (last on 20 September 2026) …
      - {type: sitemap_index, url: 'https://aif.ru/sitemap.xml', child: 'sitemap_(news|articles)(_\d+)?\.xml$', order: lastmod, max_children: 4}
      # … so the paged news list ("load more", 15 a page) covers the days in between.
      - type: html_list
        url: 'https://aif.ru/news?page={n}'
        pages: 400
        item: '<a href="(?P<url>https://aif\.ru/[^"]+)"><span class="item_text__title">(?P<title>[^<]+)</span></a>\s*<span class="text_box__date">(?P<date>\d\d\.\d\d\.\d{4} \d\d:\d\d)</span>'

  - id: mk
    name: Moskovsky Komsomolets
    name_ru: Московский комсомолец
    lang: ru
    group: mass
    home: https://www.mk.ru
    eu_blocked: false
    about:
      en: Popular Moscow tabloid and national news site.
      fi: Suosittu moskovalainen iltapäivälehti ja valtakunnallinen uutissivusto.
      sv: Populär Moskvatabloid och rikstäckande nyhetssajt.
    note:
      en: 'MK did not answer GitHub''s servers, where Woland''s collection runs, from 27 to 29 September 2026, and has answered them on most nights since, though not on every one. On a night it does not answer, its articles are read from the copies the Internet Archive makes of its pages, which hold about 95% of them a day or two later; each such article''s details say so. MK allows about 15 pages a minute, so after a busy night some articles may stay headline only until the next run reads their pages.'
      fi: 'MK ei vastannut GitHubin palvelimille, joilla Wolandin keruu toimii, 27.–29.9.2026, ja on sen jälkeen vastannut useimpina öinä mutta ei joka yö. Yönä, jona se ei vastaa, sen artikkelit luetaan kopioista, jotka Internet Archive tallentaa sen sivuista; niissä on noin 95 % artikkeleista päivän tai kaksi myöhemmin, ja kunkin tällaisen artikkelin tiedoissa kerrotaan tästä. MK sallii noin 15 sivua minuutissa, joten kiireisen yön jälkeen osa artikkeleista voi jäädä pelkiksi otsikoiksi, kunnes seuraava ajo lukee sivut.'
      sv: 'MK svarade inte GitHubs servrar, där Wolands insamling körs, den 27–29 september 2026 och har sedan dess svarat de flesta nätter, men inte alla. En natt då det inte svarar läses dess artiklar från de kopior som Internet Archive sparar av dess sidor, som rymmer omkring 95 % av dem en dag eller två senare; varje sådan artikels detaljer säger det. MK tillåter ungefär 15 sidor i minuten, så efter en hektisk natt kan en del artiklar finnas bara som rubrik tills nästa körning läser sidorna.'
    rate: 4.0   # answers more than ~15 pages a minute with 429 "too many requests"
    # From GitHub's servers every connection timed out on 27-29 September 2026, and on 2, 3, 6 and 9 October (from
    # Finland it answers); on the other nights since 30 September it answered.
    # A cap, so that a night of completing headline-only records does not delay the website.
    budget: 90
    article: '^https://www\.mk\.ru/[a-z0-9/-]+/\d{4}/\d{2}/\d{2}/[^/?#]+\.html$'
    sources:
      - {type: html_list, per: day, url: 'https://www.mk.ru/news/{y}/{m}/{d}/', pages: 1, link: 'https://www\.mk\.ru/[a-z0-9/-]+/{y}/{mm}/{dd}/[^/"?#]+\.html'}
      - {type: sitemap_index, url: 'https://www.mk.ru/sitemap/index.xml', child: '(delta/)?articles_sitemap_\d+_map\.xml$', order: lastmod, max_children: 3}
      # While MK does not answer, its pages are read from the Internet Archive's copies. Checked against
      # 1–25 September 2026: the Archive had captured 90–99% of MK's articles of every day, half of them
      # within 18 hours of the day's start, and its copies read exactly like the pages (one prefix a section).
      - type: wayback
        every_run: true
        per: month
        prefix: ['www.mk.ru/politics/{y}/{mm}/', 'www.mk.ru/incident/{y}/{mm}/', 'www.mk.ru/social/{y}/{mm}/',
                 'www.mk.ru/showbiz/{y}/{mm}/', 'www.mk.ru/economics/{y}/{mm}/', 'www.mk.ru/sport/{y}/{mm}/',
                 'www.mk.ru/science/{y}/{mm}/', 'www.mk.ru/culture/{y}/{mm}/', 'www.mk.ru/moscow/{y}/{mm}/',
                 'www.mk.ru/mosobl/{y}/{mm}/', 'www.mk.ru/realestate/{y}/{mm}/', 'www.mk.ru/auto/{y}/{mm}/']

  - id: lenta
    name: Lenta.ru
    name_ru: Лента.ру
    lang: ru
    group: mass
    home: https://lenta.ru
    eu_blocked: true
    about:
      en: One of Russia's most-read news sites, owned by the Sberbank-controlled Rambler group.
      fi: Yksi Venäjän luetuimmista uutissivustoista; omistaja on Sberbankin hallitsema Rambler-konserni.
      sv: En av Rysslands mest lästa nyhetssajter, ägd av den Sberbankkontrollerade Ramblergruppen.
    article: '^https://lenta\.ru/(news|articles)/\d{4}/\d{2}/\d{2}/[^/?#]+/$'
    sources:
      - {type: rss, url: 'https://lenta.ru/rss/news'}
      - {type: html_list, per: day, url: 'https://lenta.ru/news/{y}/{mm}/{dd}/', next: 'https://lenta.ru/news/{y}/{mm}/{dd}/page/{n}/', pages: 25, link: '/news/{y}/{mm}/{dd}/[^/"?#]+/'}

  - id: gazeta
    name: Gazeta.ru
    name_ru: Газета.ру
    lang: ru
    group: mass
    home: https://www.gazeta.ru
    eu_blocked: false
    about:
      en: News site of the Sberbank-controlled Rambler group.
      fi: Sberbankin hallitseman Rambler-konsernin uutissivusto.
      sv: Nyhetssajt inom den Sberbankkontrollerade Ramblergruppen.
    # Every page first sends the browser to an optional Sber ID sign-in. For anyone not signed in, the
    # page's own script sets this cookie ("pause the sign-in for four hours") and returns to the article.
    # Woland holds the same cookie, i.e. it simply declines to sign in; it is not a bot check.
    cookies: {unity_pause_sso: '1'}
    headline: h1   # its <title> is keyword-stuffed for search engines and there is no og:title
    article: '^https://www\.gazeta\.ru/[a-z_]+/((news/)?\d{4}/\d{2}/\d{2}/\d+|\d+/[a-z0-9_-]+)\.shtml$'   # the second: explainers
    sources:
      - {type: rss, url: 'https://www.gazeta.ru/export/rss/first.xml'}
      # "Show more" on the news page: 50 news items at a time, continuing from the oldest time shown.
      - type: html_list
        url: 'https://www.gazeta.ru/news/?p=page&pub_time={cursor}'
        pages: 400
        item: &gazeta_item 'data-pub_time="(?P<ts>\d+)"[^>]*>\s*<div class="b_ear-textblock">\s*<a href="(?P<url>/[a-z_]+/(?:(?:news/)?\d{4}/\d{2}/\d{2}/\d+|\d+/[a-z0-9_-]+)\.shtml)" class="b_ear-title">(?P<title>[^<]+)'
      # Analysis and opinion pieces, listed per section in the same way.
      - {type: html_list, url: 'https://www.gazeta.ru/politics/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}
      - {type: html_list, url: 'https://www.gazeta.ru/army/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}
      - {type: html_list, url: 'https://www.gazeta.ru/business/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}
      - {type: html_list, url: 'https://www.gazeta.ru/social/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}
      - {type: html_list, url: 'https://www.gazeta.ru/culture/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}
      - {type: html_list, url: 'https://www.gazeta.ru/science/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}
      - {type: html_list, url: 'https://www.gazeta.ru/tech/?p=page&pub_time={cursor}', pages: 60, item: *gazeta_item}

